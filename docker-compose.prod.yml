services:
  app:
    image: ai-content-aggregator:10.3
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - "${GC_LOG_DIR:?GC_LOG_DIR must be set}:/app/logs/gc"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
