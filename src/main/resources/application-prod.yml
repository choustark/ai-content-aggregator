# Prod Profile - 生产环境.
# 所有可能变动的值均通过环境变量注入, 不给默认值 - 快速失败优于运行时崩溃.
# Actuator env 端点关闭, 防止密钥泄露.

spring:
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: ${REDIS_CLUSTER_MAX_REDIRECTS:3}

redis:
  cluster:
    nodes: ${REDIS_CLUSTER_NODES_LIST}
    username: ${REDIS_CLUSTER_USERNAME:}
    password: ${REDIS_CLUSTER_PASSWORD:}

langchain4j:
  community:
    redis:
      enabled: ${LANGCHAIN4J_REDIS_ENABLED:${features.rag.enabled:false}}
      index-name: ${LANGCHAIN4J_REDIS_INDEX:aiaggregator-embeddings}
      dimension: ${LANGCHAIN4J_REDIS_DIMENSION:1024}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    env:
      access: none
      show-values: NEVER

observability:
  slow-operations:
    redis-threshold: ${OBSERVABILITY_SLOW_OPERATIONS_REDIS_THRESHOLD:100ms}
    http-threshold: ${OBSERVABILITY_SLOW_OPERATIONS_HTTP_THRESHOLD:2s}
    sdk-threshold: ${OBSERVABILITY_SLOW_OPERATIONS_SDK_THRESHOLD:10s}

logging:
  file:
    # 容器生产环境只写 stdout ECS；持久化由部署层日志采集负责。
    name: ""
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ai-content-aggregator
  level:
    com.choucj.aiaggregator: INFO
    org.springframework.boot.context.config: WARN
    io.lettuce.core.protocol.ConnectionWatchdog: WARN
    io.lettuce.core.protocol.ReconnectionHandler: WARN
