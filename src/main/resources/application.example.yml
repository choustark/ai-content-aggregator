# 主配置模板文件 - 复制为 application.yml 后按需调整.
# application.yml 已在 .gitignore 中, 不会进入 Git.
#
# 用法:
#   cp src/main/resources/application.example.yml src/main/resources/application.yml
#   然后编辑 application.yml, 通常只需调整 management.endpoints 与 logging.level.
#
# 注意:
#   - 本文件不含密钥. 密钥统一放 api-keys.yml (复制 api-keys.example.yml).
#   - feature-flags.yml / resilience.yml 不含密钥, 直接提交, 无需 example.
#   - Spring Boot 加载顺序: application.yml → application-{profile}.yml → spring.config.import 引入的外部 yml.

spring:
  application:
    name: ai-content-aggregator
  profiles:
    # 通过 SPRING_PROFILES_ACTIVE 环境变量切换 dev/test/prod, 默认 dev.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # 引入外部配置. optional: 前缀表示缺失不报错 (如未复制 api-keys.yml 时启动 dev 也能跑).
    # 加载顺序: 后引入的覆盖先引入的. api-keys 最后加载, 优先级最高.
    import:
      - "optional:classpath:api-keys.yml"
      - "optional:classpath:feature-flags.yml"
      - "optional:classpath:resilience.yml"
  data:
    redis:
      cluster:
        # 业务键值(Lettuce)集群总开关.
        # 关闭时 RedisClusterLettuceConfiguration 不注册 RedisConnectionFactory / StringRedisTemplate.
        # 集群节点列表(nodes)由 application-{profile}.yml 提供.
        enabled: true

management:
  endpoints:
    web:
      exposure:
        # env 端点会暴露所有属性 (含密钥), prod 必须收紧到 health,info.
        # dev/test 保留 env 方便调试.
        include: health,info,env,features,costs
  endpoint:
    health:
      show-details: when-authorized
  endpoint.env.show-values: when-authorized

# 内容处理调度器配置
schedule:
  # 调度器总开关 — 关闭时 ContentScheduler Bean 不注册, @Scheduled 不触发.
  # 仅用于故障排查场景, prod/dev 默认开启.
  enabled: true
  # cron 表达式 — 默认每天晚上 22:00 抓取并生成内容.
  # 示例: "0 0 22 * * ?" 每天 22:00 / "0 0 23 * * ?" 每天 23:00.
  cron: "0 0 22 * * ?"
  # 启动时执行一次 — 默认关闭, 避免重启时绕开“晚上抓取、早上发布”的运营节奏.
  # 需要排查或补抓时可手动调用 POST /api/tasks/trigger.
  run-on-startup: false

# RSSHub 实例配置 — Twitter 推文发现层的数据源入口.
# 公网 rsshub.app 经常被限流, 建议配置至少 1 个备用实例(自部署 docker / 第三方镜像).
# 调用方按列表顺序依次尝试, 主失败切备, 全部失败抛 RetryableException.
rsshub:
  # RSSHub 总开关 — 关闭时 RSSHubClient.discoverTweets 直接返回空列表.
  # 故障排查或临时禁用 Twitter 抓取时设为 false.
  enabled: true
  # HTTP 调用超时(秒) — 单次抓取通常 1-5s, 超过 30s 视为卡死切下一实例.
  timeout-seconds: 30
  instances:
    # 公网主实例, 末尾不带斜杠.
    - https://rsshub.app
    # 自部署 docker 备用实例(取消注释启用):
    # - http://localhost:1200

# Twitter 账号列表 — TwitterSource 编排 RSSHub + FxTwitter 的目标账号.
# handle 不带 @ 前缀. 空列表时 fetch() 返回空.
twitter:
  # 推文发现 provider 优先级链: scraper / apify / rsshub.
  # scraper: 本地 x-author-self-scraper 服务(默认推荐, 不走 Apify 云配额)
  # apify: Apify 云端 Actor parseforge~x-com-scraper 或自定义 Actor
  # rsshub: RSSHub 发现 + twscrape/FxTwitter 补全
  discovery-providers:
    - scraper
    - apify
    - rsshub
  # 旧版单 provider 配置: discovery-providers 为空时才使用.
  discovery-provider: rsshub
  accounts:
    - karpathy
    - sama
  # Story 6.4: 指定 X 内容抓取入口(post URL / post ID / Article URL).
  # 集成型开关, 默认 false; 关闭时不调 Apify、不消费配额, 账号发现链路零回归.
  target:
    enabled: false
    urls: []
    # urls 示例(取消注释后使用):
    #   - https://x.com/OpenAI/status/1234567890
    #   - 1234567890          # 纯 post ID(spike Q1a 未测变体, 默认归一化为 /i/status/{id})
    #   - https://x.com/i/article/...   # Article URL(spike Q1b 未测变体, best-effort 透传)
  # Story 7.1: X 媒体本地归档(确定性目录 + media.json sidecar).
  # 集成型开关, 默认 false; 关闭时 TweetMediaArchiveWriter Bean 不注册, 媒体归档不激活, 既有 Pipeline 零回归.
  media:
    enabled: false
    # base-directory 为空时 fallback 到 archive.base-directory(Story 2.5), 复用同一 Docker 卷挂载点.
    # 归档目录 = {base-directory}/media/twitter/{yyyy-MM-dd}/{tweetId}/media.json
    base-directory:
    date-pattern: yyyy-MM-dd
    sidecar-filename: media.json
    # Story 7.2: 图片下载参数
    download-timeout-seconds: 30
    max-file-size-mb: 10

scraper:
  # 本地 x-author-self-scraper API 服务. 该服务内部运行 Apify SDK/Crawlee Actor,
  # 但 HTTP 协议不是 Apify 云端 /v2/acts/*, 因此独立配置.
  base-url: http://127.0.0.1:3100
  timeout-seconds: 180
  poll-interval-ms: 1000
  max-wait-seconds: 180
  include-posts: true
  include-articles: false
  include-replies: false
  max-items-per-author: 50
  max-articles-per-author: 10
  max-scrolls: 30
  scroll-delay-ms: 1800

# Apify Twitter/X Actor 发现配置 — twitter.discovery-providers 包含 apify 时可用.
# 默认适配 parseforge~x-com-scraper:
#   https://apify.com/parseforge/x-com-scraper
apify:
  twitter:
    base-url: https://api.apify.com
    actor-id: parseforge~x-com-scraper
    token: ${APIFY_API_TOKEN:}
    max-tweets-per-account: 50
    timeout-seconds: 180
    use-search-terms: false
    search-term-field: searchTerms
    search-term-template: "from:%s"
    handle-field: usernames
    max-items-field: maxItems
    # Story 6.4: 指定内容 Actor input 字段名(spike-6.1 F1 实测为 startUrls, 勿改).
    start-urls-field: startUrls
    input-defaults:
      sort: Latest

# FxTwitter 补全客户端配置 — 通过 /i/status/{id}.json 端点补全 content/互动数/imageUrls.
# 默认公共实例 https://api.fxtwitter.com (Vercel global edge, 稳定性较好).
# Story 2.2b 后作为 twscrape 的降级路径 — 关闭(enabled=false) 时仅走 twscrape 主路径.
fxtwitter:
  enabled: true
  timeout-seconds: 15
  instance: https://api.fxtwitter.com

# twscrape CLI 补全客户端配置 — Story 2.2b 主路径.
# 通过 ProcessBuilder 调用 twscrape tweet {url} 子进程, 拉取已登录账号视角的完整推文字段.
# 凭据(cookie / 账号)不通过此处绑定, 由运行环境 twscrape add_accounts 命令维护登录态.
# 关闭(enabled=false) 时直接走 FxTwitter 降级(等价 Story 2.2a 单链行为).
twscrape:
  enabled: true
  # CLI 调用超时(秒) — twscrape 单次抓取 5-30s, 慢网络可达 60s+. 最小 60s.
  timeout-seconds: 120
  # 可执行文件名或绝对路径 — 默认依赖 PATH 查找. Docker 镜像位于 /usr/bin/twscrape.
  executable: twscrape
  # 忽略账号凭据校验(测试用) — 生产保持 false.
  skip-account-check: false

# LLM 模型配置 (Story 2.3a) — api-key 与 base-url 统一在 api-keys.yml 中维护,
# 不在本文件重复 (配置文件分离原则, 见 Story 1.2).
# Spring Boot 通过 spring.config.import 加载 api-keys.yml, LlmProperties 自动绑定 llm.* 键.
# 占位符示例 (复制 api-keys.example.yml 为 api-keys.yml 后填写):
#   llm:
#     deepseek:
#       api-key: ${LLM_DEEPSEEK_API_KEY:your-deepseek-api-key}
#       base-url: https://api.deepseek.com
#     glm:
#       api-key: ${LLM_GLM_API_KEY:your-glm-api-key}
#       base-url: https://open.bigmodel.cn/api/paas/v4
# 主路径 DeepSeek + 备用 GLM, LlmConfig 注册两个 ChatModel Bean, LangChain4jLlmClient 自动降级.

# RAG / Embedding 配置 (Story 5.1/5.2) — 默认关闭, 开启后注册 EmbeddingService + ReferenceRetriever.
# GLM embedding 复用 api-keys.yml 的 llm.glm.api-key / LLM_GLM_API_KEY.
langchain4j:
  open-ai:
    embedding-model:
      # GLM embedding-3, OpenAI 兼容协议.
      model-name: embedding-3
      # GLM embedding-3 默认 2048 维; Story 5.1 显式收窄为 1024 维.
      dimensions: 1024
      timeout: 60s
  community:
    redis:
      # standalone Redis-Stack 向量库开关; features.rag.enabled=true 时注册完整存储/检索能力.
      # RAG 总开关默认 false, 因此这里保持 true 也不会在默认配置下创建 Redis 连接.
      enabled: true
      host: localhost
      port: 7100
      index-name: aiaggregator-embeddings
      prefix: "rag:embedding:"
      dimension: 1024

# 内容筛选器配置 (Story 2.3b) — 两级筛选阈值.
# 第一级 CommentFilter 按 replyCount >= comment-threshold 剔除低互动推文.
# 第二级 InnovationFilter 调 LLM 评分 (1-10), innovationScore >= innovation-threshold 才保留.
# 默认 10 / 6.0 来自 PRD FR3 调研结论, 节省 80%+ Token 成本.
filter:
  # 评论数下限 — 默认 10. 调高保留更高质量内容, 调低保留更多.
  comment-threshold: 10
  # AI 创新度评分下限 (1-10) — 默认 6.0, 仅保留中等及以上.
  innovation-threshold: 6.0

# 内容改写器配置 (Story 2.4 / 5.4) — 默认 DeepSeek 主 + GLM 备单模型改写.
# SingleModelRewriter 调 LlmClient.chat(system, user) 改写推文为微信公众号文章,
# 失败时手动重试 max-retries 次 (总尝试 = 1 + max-retries), 退避间隔递增.
# 多模型投票由 feature-flags.yml 的 feature-flags.multi-model.enabled 控制; 开启后同一 rewriter.*
# 重试/截断配置会被 DeepSeek 和 GLM 两条显式模型调用共同复用.
rewriter:
  # 重试次数 — LLM 调用失败后重试的次数, 总尝试 = 1 + max-retries (默认 4 次).
  # 范围 [0, 10], 0 表示不重试 (单次失败即抛 RetryableException).
  max-retries: 3
  # 重试退避毫秒 (初始值) — 实际等待 = retry-backoff-ms * attemptIndex (1s, 2s, 3s 递增).
  # 范围 [100, 60000].
  retry-backoff-ms: 1000
  # 源推文截断上限 (code points) — 防 prompt 过长撑爆 LLM context.
  # 按 code point 截断 (非 char), 防 UTF-16 代理对 emoji 切断产生乱码. 范围 [100, 10000].
  content-max-code-points: 2000
  # 多模型投票 request-level 等待上限 — 默认略高于 LLM HTTP 60s timeout.
  # 超时后等待两个 future 收敛并按失败矩阵抛 RetryableException / 返回成功候选. 范围 [1000, 300000].
  multi-model-deadline-ms: 65000

# 成本监控配置 (Story 5.5) — 单价是运营配置, 不在代码中硬编码.
# 金额统一用 cents / 1M tokens; monthly-budget-cents=0 表示只观测不阻断自动处理.
cost:
  monitor:
    monthly-budget-cents: 0
    warning-threshold-percent: 80
    stop-threshold-percent: 100
    daily-cron: "0 5 0 * * ?"
    summary-ttl-days: 400
  pricing:
    deepseek:
      input-cents-per-million: 14
      output-cents-per-million: 28
    glm:
      input-cents-per-million: 20
      output-cents-per-million: 80

# Markdown 归档器配置 (Story 2.5) — NFR4 双重存储的文件系统侧.
# MarkdownArchiver implements ContentPublisher, 将 Article 写入 archive/{yyyy-MM-dd}.md 按天归档.
# 同日多篇文章追加到同一文件, 用 separator 分隔. Docker 卷挂载 ./archive:/app/archive 对应.
archive:
  # 归档根目录 — 相对路径基于 JVM 工作目录 (本地开发 ./archive, Docker /app/archive).
  # 目录不存在时由 Files.createDirectories 自动递归创建.
  base-directory: "archive"
  # 总开关 — 关闭时 MarkdownArchiver Bean 不注册 (@ConditionalOnProperty matchIfMissing=true).
  # 仅故障排查时设为 false, 正常运行保持 true.
  enabled: true
  # 文件名日期格式 — ISO 8601 严格 yyyy-MM-dd. 由 DateTimeFormatter 解析, 非法格式启动失败.
  date-pattern: "yyyy-MM-dd"
  # 文件扩展名 — 默认 .md (Markdown).
  file-suffix: ".md"
  # 同日多文章块之间的分隔符 — Markdown 水平分割线, 视觉清晰区分同时不破坏渲染.
  separator: "\n\n---\n\n"

# Twitter 处理流水线配置 (Story 2.6) — 编排 TwitterSource→Filter→Rewriter→Archiver 端到端闭环.
# TwitterProcessor.process() 串联 5 个阶段: fetch / commentFilter / innovationFilter / rewrite / publish.
# ContentScheduler.processTask(taskId) 按 task-id-prefix 路由 (默认 "twitter") 到 TwitterProcessor.
processor:
  # 故障隔离总开关 — true 时 per-article try/catch+continue 单条失败不阻塞整批 (生产默认).
  # false 时异常透传到 ContentScheduler 顶层 (仅调试用, 排查问题时定位具体阶段).
  # Patch-2 修复: 配置承诺与运行时行为一致 — false 时 per-article 异常 throw 到 process() 顶层.
  fault-isolation-enabled: true
  # taskId 前缀 — ContentScheduler.processTask 按此前缀路由到 TwitterProcessor.
  # Patch-3 修复: ContentScheduler 注入 ProcessorProperties, 真正按此前缀路由 (不再硬编码 "twitter:").
  task-id-prefix: "twitter"

# 功能开关 — 数据源模块级启停. 默认全部启用 (matchIfMissing=true).
# Story 4.1: features.github.enabled 与 feature-flags.github.enabled 任一显式 false,
# 都会关闭 GitHubSource/GitHubClient/GitHubConfig Bean 注册.
features:
  rag:
    # RAG 总开关 — false 时 EmbeddingService / EmbeddingModel / ReferenceRetriever Bean 不注册.
    enabled: false
    # 历史参考文章相似度阈值, 直接传给 EmbeddingService.searchSimilar minScore.
    similarity-threshold: 0.75
    # 单次改写可取的参考文章数量上限.
    max-references: 3
    # 异步批量 Embedding future 超时, 默认 120s.
    async-timeout: 120s
    # 异步批量 Embedding 专用线程池大小, 避免阻塞 HTTP 占用 commonPool.
    async-threads: 2
    # 异步批量 Embedding 等待队列容量, 超过后由调用线程执行以形成背压.
    async-queue-capacity: 100
  github:
    # GitHub 数据源总开关 — 关闭时整个 source/github/ 子包 Bean 不注册.
    # 仅故障排查 / 暂时禁用 GitHub 抓取时设为 false.
    enabled: true

# GitHub 数据源配置 (Story 4.1) — token 实际在 api-keys.yml 维护 (Story 1.2 配置分离原则).
# 占位符示例 (复制 api-keys.example.yml 为 api-keys.yml 后填写):
#   github:
#     token: ${GITHUB_TOKEN:your-github-token}
# spike-4.1 §2.2 决策: Fine-grained PAT (公开仓库只读, 无 scope 需要) 优于 Classic PAT.
# 未配置 token 时降级为未认证调用 (Search 10/min vs 认证 30/min, spike-4.1 §2.3 实测).
github:
  # GitHubClient 内部开关 (与 features.github.enabled 双层保险).
  enabled: true
  # GitHub Fine-grained PAT — 默认空 (未认证模式). 实际值在 api-keys.yml 维护.
  token: ""
  # HTTP 调用超时 (秒) — connect + read 均应用. 默认 30s (与 RSSHubClient 一致).
  timeout-seconds: 30
  # Trending 抓取配置 (spike-4.1 §2.1 决策: 用 Search API 替代官方无 /trending 端点).
  trending:
    # 查询模板 — 占位符 {date} (lookback-days 天前 ISO 日期) / {language}. 用 String.replace 渲染 (B2 模式).
    # 模板设计: created:>{date} 限制近 N 天新建仓库 + language:{language} 限定语言, sort=stars 取最高.
    query-template: "created:>{date}+language:{language}"
    # 回溯天数 — {date} = 今天 - lookback-days. 默认 7 (近一周新仓库). 范围 [1, 90].
    lookback-days: 7
    # 返回前 N 条 — per_page 参数. 默认 10. 范围 [1, 100] (GitHub per_page 上限 100).
    top-n: 10
    # 主语言 — {language} 占位符替换值. 默认 java. 留空则查询所有语言 (需同步改 query-template).
    language: "java"
  # README 截断 (Story 4.2 实施, 本 story 仅声明配置占位).
  readme:
    # README 最大字符数 (KB) — spike-4.1 §2.6 决策 100KB (≈60K token, 占 128K 上下文 47%).
    max-size-kb: 100
  # 价值分析配置 (Story 4.3) — GitHubValueAnalyzer 对每个 repo 调 LLM 综合评分 (4 维度:
  # 技术创新/实用价值/社区活跃/AI 相关), 评分 >= score-threshold 才进 Story 4.4 改写环节.
  # 全批 LLM 失败 (双链全挂 / 全批响应不可解析) 时降级为 stars >= star-fallback-threshold 筛选 (AC-4).
  value-analyzer:
    # 价值评分通过阈值 (1-10) — repo.valueScore >= 此值才保留. 默认 7.0 (epics AC-1).
    # 严格 >= 比较. 范围 [0.0, 10.0] — 下限防负数, 上限防误配 11 静默剔除全部.
    score-threshold: 7.0
    # Star 数降级阈值 — LLM 双链全挂 / 全批响应不可解析时, stars >= 此值的 repo 仍保留 (AC-4).
    # 默认 100 (epics AC-4, spike-4.1 调研结论: 高质量 Java 仓库分水岭).
    # 范围 [0, 1000000] — 下限防负数, 上限防误配 Integer.MAX_VALUE 静默剔除全部.
    star-fallback-threshold: 100
    # README 输入截断 (code point) — 送入 LLM prompt 的 README 长度上限.
    # 默认 8000 (≈12K token, 占 DeepSeek 64K 上下文 19%, C1 token 估算模式, spike-4.1 §2.6).
    # 范围 [1000, 50000] — 下限防过短失信息, 上限防 LLM 上下文溢出.
    # 注意: 与 Story 4.2 的 readme.max-size-kb (字节级硬截断) 不冲突 — 本参数是 codepoint 软截断.
    readme-max-code-points: 8000

# 微信公众号发布配置 (Story 3.1) — 两层配置: SDK 层 (wx.mp.*) + 项目层 (wechat.mp.*).
#
# [SDK 层] wx.mp.* — 由 WxJava starter 4.6.0 WxMpProperties 直接消费, app-id/secret 实际在 api-keys.yml.
# starter 自动配置链: WxMpAutoConfiguration → WxMpStorageAutoConfiguration (创建 WxMpDefaultConfigImpl)
# → WxMpServiceAutoConfiguration (创建 WxMpServiceHttpClientImpl).
# 项目不再排除 WxJava starter 自动配置; 需要微信发布时设置 wechat.mp.enabled=true 并提供 wx.mp.app-id/secret.
wx:
  mp:
    app-id: ${WX_MP_APP_ID:dev-placeholder}
    secret: ${WX_MP_SECRET:dev-placeholder}
    # token / aes-key: 仅消息回调场景需要 (本 spike 暂不接入)
    config-storage:
      # 存储类型 — Memory 默认 (适合单实例 + 测试号); Jedis / RedisTemplate 用于多实例共享 access token
      # Story 5.x 多实例部署时升级 RedisTemplate; 当前 Memory 模式适合单实例本地调试
      type: Memory
      # http 客户端类型 — HttpClient 默认; OkHttp / JoddHttp 备选
      httpClientType: HttpClient
      # Redis 存储键前缀 (type=Jedis/RedisTemplate 时生效)
      key-prefix: wx

# [项目层] wechat.mp.* — 项目层包装配置, 由 WeChatProperties 消费.
# 与 wx.mp.* 区分: wx.mp.* 是 SDK 字段直通, wechat.mp.* 是项目层业务语义 (将来切换 SDK 不变).
wechat:
  mp:
    # 发布渠道总开关 — false 时 WeChatClient / WeChatPublisher / 项目层 WeChatConfig Bean 不注册.
    # WxMpService 由 WxJava starter 根据 wx.mp.* 标准配置自动创建; 本开关只控制项目层发布链路.
    enabled: false
    # Story 8.3: 生成模式路由入口. 默认关闭以保持现有 REWRITE 流程不变.
    # Story 8.6/9.1: 媒体感知发布链路前置条件矩阵 (AC9) — 三个开关必须同时满足:
    #   1. wechat.mp.enabled=true            → gateway/renderer/preparer/converter/publisher 注册
    #   2. twitter.media.enabled=true        → archiver/writer/gate 注册 (推文有媒体时必需;
    #                                          有媒体但本开关 false → 媒体感知/原帖复现 generator
    #                                          NonRetryable 显式 fail-fast, message 含缺失开关名)
    #   3. wechat.mp.original-post.enabled=true → 模式路由 (per-tweet: tweet.url 命中
    #      twitter.target.urls 返回 default-mode, 未命中走 REWRITE)
    # 配置矛盾场景 (模式信号命中但 wechat.mp.enabled=false) → TwitterProcessor
    # NonRetryable 显式 fail-fast, 不静默降级 REWRITE.
    original-post:
      enabled: false
      # Story 9.1 (AC11): 已批准的整体默认流程 — AI 改写 + 文章媒体发布微信公众号草稿.
      #   REWRITE            — 纯 AI 改写 Markdown (不下载/上传媒体)
      #   PRESERVE_ORIGINAL  — 确定性原帖复现 HTML
      #   REWRITE_WITH_MEDIA — AI 改写 Markdown + 原帖 PHOTO 媒体归档/微信上传/正文图片嵌入
      # 仅在无 target urls 配置时全局生效 (有 target urls 时按 per-tweet 命中判定返回本值).
      # VIDEO/GIF 不进入正文图片上传, 仅降级进本地媒体审计.
      default-mode: REWRITE_WITH_MEDIA
    # 草稿默认作者名 (微信公众号后台展示)
    default-author: "AI 内容聚合器"
    # 人工审核提醒日志开关 (Story 3.5) — 微信草稿创建成功后是否输出
    # "请到微信公众号后台预览并手动发布" log.info 提醒. 关闭时仅跳过提醒日志, DRAFT_CREATED 状态写入不跳过.
    # 默认 true. 若用户已通过其他渠道 (如邮件/IM 通知) 获知草稿创建, 可关闭避免日志冗余.
    review-reminder-enabled: true
    # 混合发布模式配置 (Story 3.4) — 仅在 enabled=true 时生效.
    # PublishingModeDecider 按 innovationScore 阈值实时/批量分流,
    # BatchPublishingScheduler 每天早上 08:00 扫描本地发布池并创建微信草稿.
    publishing:
      # 实时发布阈值 — Article.innovationScore >= 此值时实时创建草稿 (默认 8).
      # 严格 >= 比较 (与 epics.md "重要内容 innovationScore>=8" 文案对齐). 范围 [1, 10].
      realtime-threshold: 8
      # 批量发布 cron — Spring CronExpression 格式 (秒 分 时 日 月 周).
      # 默认 "0 0 8 * * ?" 每天早上 08:00 触发 BatchPublishingScheduler.
      batch-cron: "0 0 8 * * ?"
      # 低分文章默认进入下一次该小时发布窗口; 晚上抓取时会排到次日 08:00.
      daily-publish-hour: 8
      # 批量调度器总开关 — false 时 BatchPublishingScheduler Bean 不注册.
      # 仅调试用, 关闭后低于阈值的 Article 仍入队但永不消费 (默认 true).
      batch-enabled: true
      # 旧 Redis 批量队列 TTL 兼容项; 新发布池基于 archive/articles/{articleId}.json 扫描到期稿件.
      queue-ttl-days: 7
    client:
      # 是否启用 stable access token (避免高频刷新触发微信限流)
      # 注意: starter 4.6.0 默认未开启, Story 3.1 通过自定义 WxMpConfigStorage Bean 覆盖 useStableAccessToken(true)
      stable-access-token: true
