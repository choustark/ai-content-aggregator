# Dev Profile - 本地开发环境.
# Redis Cluster 3 节点在本机 7001/7002/7003.

spring:
  data:
    redis:
      cluster:
        nodes:
          - localhost:7001
          - localhost:7002
          - localhost:7003
        max-redirects: 3

redis:
  cluster:
    nodes:
      - host: localhost
        port: 7001
      - host: localhost
        port: 7002
      - host: localhost
        port: 7003

langchain4j:
  community:
    redis:
      enabled: ${features.rag.enabled:false}
      index-name: aiaggregator-embeddings
      dimension: 1024

logging:
  level:
    com.choucj.aiaggregator: DEBUG
