global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: single-host

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ai-content-aggregator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - aiaggregator-host:8080

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
